name: VESPER checks
on:
  pull_request:
  push:
    branches: [main, codex/vesper-v7-planner]
permissions:
  contents: read
jobs:
  planner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - run: npm test
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:firebase
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          retention-days: 3
