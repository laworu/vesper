<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a15"><meta name="description" content="VESPER — твоя вселенная учебы, привычек и достижений"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>VESPER · твоя вселенная</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f1efff;background:#080a15}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#20173e 0,transparent 52%),#080a15;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:#c5a8ff}header{display:flex;align-items:center;justify-content:space-between;padding:17px 22px;border-bottom:1px solid #ffffff18;background:#090b19bb;position:sticky;top:0;z-index:10;backdrop-filter:blur(14px)}.brand{letter-spacing:.33em;font-weight:800;font-size:18px}.sub{color:#a5a3bd;font-size:12px}.shell{max-width:1150px;margin:auto;padding:20px}.nav{display:flex;gap:7px;overflow:auto;padding:12px 0 18px}.nav button,.chip{white-space:nowrap;background:#19182b;border:1px solid #37314e;border-radius:30px;color:#d9d0f8;padding:10px 13px}.nav button.active{background:#4d357d;color:white}.panel{background:#151626e8;border:1px solid #34314a;border-radius:20px;padding:19px;margin-bottom:16px;box-shadow:0 10px 30px #0002}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.muted{color:#aaa8c3}.small{font-size:12px}h1,h2,h3{margin:0 0 12px}h1{font-size:27px}h2{font-size:21px}h3{font-size:16px}.metric{background:#202037;padding:16px;border-radius:16px}.metric strong{display:block;color:#d1b5ff;font-size:25px;margin-bottom:6px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:10px}.btn{background:#7756c7;color:white;border:0;border-radius:12px;padding:11px 15px}.btn.secondary{background:#2a2943}.btn.danger{background:#663346}.btn:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;min-width:0;background:#0e1020;color:#f4efff;border:1px solid #49425f;border-radius:11px;padding:11px}label{display:block;color:#b9b2d1;font-size:12px;margin-bottom:5px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.item{padding:13px;background:#202039;border-radius:13px;margin:8px 0}.item.done{opacity:.7}.progress{height:9px;border-radius:8px;background:#34344c;overflow:hidden;margin:9px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#7964db,#b8a1ff)}.space{height:480px;position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(ellipse at 52% 52%,#24214d 0,#0a0d20 46%,#040610 85%);border:1px solid #302b54;touch-action:pan-y}.space:before{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 10% 18%,#fff 99%,transparent),radial-gradient(1px 1px at 34% 62%,#fff 99%,transparent),radial-gradient(2px 2px at 82% 25%,#fff 99%,transparent),radial-gradient(1px 1px at 65% 78%,#fff 99%,transparent),radial-gradient(1px 1px at 91% 90%,#fff 99%,transparent);background-size:143px 119px;opacity:.6;pointer-events:none}.system{position:absolute;inset:0;transform:scale(var(--zoom,1));transition:transform .3s}.orbit{position:absolute;left:50%;top:50%;border:1px solid #8272bd32;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.celestial{position:absolute;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:23px;box-shadow:0 0 24px currentColor;transition:transform .2s;z-index:1}.celestial:hover{transform:scale(1.15)}.celestial span{position:absolute;top:110%;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;text-shadow:0 2px 7px black;color:#fff}.core{width:83px;height:83px;left:calc(50% - 41px);top:calc(50% - 41px);background:radial-gradient(circle,#d9c3ff 0,#7d51ce 35%,#27104d 67%,#0a071b 72%);color:#bd9cff}.body1{width:58px;height:58px;left:17%;top:24%;background:radial-gradient(circle at 30% 20%,#b9e6ff,#2e72bc 45%,#12275e);color:#5bbaff}.body2{width:65px;height:65px;right:15%;top:23%;background:radial-gradient(circle at 25% 22%,#f8e5b7,#b77b52 43%,#4b285a);color:#e0a578}.body3{width:49px;height:49px;left:24%;bottom:19%;background:radial-gradient(circle,#fff,#d9a9fa 20%,#702db7 53%,#1e1440);color:#b85cf8}.body4{width:60px;height:60px;right:22%;bottom:15%;background:radial-gradient(circle at 25% 20%,#e2dcff,#8179c4 44%,#2e3063);color:#9d92fa}.body5{width:42px;height:42px;left:48%;top:9%;background:radial-gradient(circle,#fff,#cbd7ff 30%,#415b9e 70%);color:#a9baff}.body6{width:48px;height:48px;left:44%;bottom:8%;background:radial-gradient(circle,#d3faff,#4587a9 40%,#192b4d);color:#8cdbf4}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{border-radius:10px;padding:9px;background:#29263f;color:white;border:1px solid #4b426a}.star{display:inline-block;color:#d6b5ff;font-size:22px}.notice{border-left:3px solid #9b7fe3;padding:10px 12px;background:#24213b;border-radius:6px;font-size:13px}.hidden{display:none!important}footer{padding:30px 15px;text-align:center;color:#79778e;font-size:12px}@media(max-width:600px){.shell{padding:12px}.space{height:390px}.body1{left:9%}.body2{right:8%}.body3{left:12%}.body4{right:11%}.brand{font-size:15px}h1{font-size:23px}.panel{padding:14px}}
</style></head><body><header><div><div class="brand">VESPER ✦</div><div class="sub">your own universe</div></div><div class="sub" id="headStats"></div></header><main class="shell"><nav class="nav" id="nav"></nav><div id="view"></div></main><footer>VESPER · Локальная версия 2.0 · Данные хранятся в этом браузере</footer><script>
const KEY='vesper_v2';const today=()=>new Date().toLocaleDateString('en-CA');const id=()=>Math.random().toString(36).slice(2,11);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Math.max(0,Number(v)||0);const defaultData=()=>({missions:[],tasks:[],tests:[],habits:[{id:id(),name:'Чтение',dates:[]},{id:id(),name:'Повторение ЕГЭ',dates:[]}],cycles:[],moods:[],blocks:[],friends:[],settings:{theme:'nebula',name:'Путешественник'},coins:0});let db;try{db={...defaultData(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{db=defaultData()}const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));head()};let page='universe',zoom=1;const sections=[['universe','Вселенная'],['missions','Миссии ЕГЭ'],['tasks','Орбита'],['habits','Пульсар'],['archive','Сверхновые'],['friends','Созвездие'],['health','Состояние'],['space','Обсерватория'],['settings','Настройки']];function head(){document.getElementById('headStats').textContent=`✧ ${db.coins} звездной пыли`};function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})};function nav(){document.getElementById('nav').innerHTML=sections.map(([p,n])=>`<button class="${p===page?'active':''}" data-go="${p}">${n}</button>`).join('')};function render(){nav();head();document.getElementById('view').innerHTML=({universe,missions,tasks,habits,archive,friends,health,space,settings}[page])();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));if(page==='universe'){document.getElementById('system').style.setProperty('--zoom',zoom);document.getElementById('spaceScene').addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(1.5,Math.max(.7,zoom+(e.deltaY<0?.1:-.1)));document.getElementById('system').style.setProperty('--zoom',zoom)},{passive:false})}}const field=(label,name,type='text',extra='')=>`<div><label>${label}</label><input name="${name}" type="${type}" ${extra} required></div>`;const empty=t=>`<p class="muted small">${t}</p>`;const bar=p=>`<div class="progress"><span style="width:${Math.max(0,Math.min(100,p))}%"></span></div>`;
function universe(){let complete=db.missions.filter(x=>x.done).length;return `<h1>Твоя вселенная</h1><p class="muted">Выбери небесное тело, чтобы перейти в раздел. Колесико мыши приближает систему.</p><div class="space" id="spaceScene"><div class="system" id="system"><div class="orbit" style="width:44%;height:45%"></div><div class="orbit" style="width:76%;height:80%"></div><button class="celestial core" data-go="settings" title="Ядро VESPER">✦<span>Ядро</span></button><button class="celestial body1" data-go="missions">✧<span>ЕГЭ · Миссии</span></button><button class="celestial body2" data-go="tasks">◌<span>Орбита · Дела</span></button><button class="celestial body3" data-go="habits">✺<span>Пульсар · Привычки</span></button><button class="celestial body4" data-go="friends">✧<span>Созвездие · Друзья</span></button><button class="celestial body5" data-go="health">☾<span>Состояние</span></button><button class="celestial body6" data-go="space">✦<span>Обсерватория</span></button></div></div><div class="tabs"><button class="btn secondary" data-action="zoomout">− Отдалить</button><button class="btn secondary" data-action="zoomin">+ Приблизить</button><button class="btn secondary" data-go="archive">✧ Архив сверхновых (${complete})</button></div><div class="grid"><div class="metric"><strong>${db.tasks.filter(t=>t.done).length}</strong>Завершено задач</div><div class="metric"><strong>${db.tests.length}</strong>Сохранено тестов</div><div class="metric"><strong>${complete}</strong>Сверхновых в архиве</div><div class="metric"><strong>🐈‍⬛</strong>Космический котик · ${db.coins} пыли</div></div>`}
function missions(){return `<h1>Миссии · ЕГЭ</h1><div class="grid"><section class="panel"><h3>Новая звезда-миссия</h3><form id="missionForm" class="stack">${field('Название темы или цели','name')}<div><label>Предмет</label><select name="subject"><option>Профильная математика</option><option>Физика</option><option>Русский язык</option><option>Другое</option></select></div>${field('Планируемое количество этапов','target','number','min="1" value="5"')}<button class="btn">Создать звезду</button></form></section><section class="panel"><h3>Записать результат теста</h3><form id="testForm" class="stack">${field('Тема','topic')}<div><label>Предмет</label><select name="subject"><option>Профильная математика</option><option>Физика</option><option>Русский язык</option></select></div><div class="fields">${field('Правильных','correct','number','min="0" value="16"')}${field('Всего','total','number','min="1" value="18"')}</div>${field('Время, минут','minutes','number','min="0" value="30"')}<button class="btn">Сохранить тест</button></form></section></div><section class="panel"><h2>Активные звезды</h2>${db.missions.filter(m=>!m.done).map(m=>`<div class="item"><div class="row"><strong>✦ ${esc(m.name)}</strong><span class="small muted">${esc(m.subject)}</span></div><div class="small muted">${m.steps}/${m.target} этапов · ${m.minutes} мин</div>${bar(m.steps/m.target*100)}<div class="tabs"><button class="btn secondary" data-action="step" data-id="${m.id}">+ Этап (25 мин)</button><button class="btn" data-action="finish" data-id="${m.id}">Завершить миссию</button></div></div>`).join('')||empty('Создай первую звезду-миссию.')}</section><section class="panel"><h2>История тестов</h2>${db.tests.slice().reverse().map(t=>`<div class="item row"><div><strong>${esc(t.topic)}</strong><div class="small muted">${esc(t.subject)} · ${t.date}</div></div><strong>${t.correct}/${t.total} · ${Math.round(t.correct/t.total*100)}%</strong></div>`).join('')||empty('Пока нет результатов.')}<p class="small muted">Точность теста и завершенность миссии считаются отдельно. Результаты ниже 80% подсвечиваются как темы для повторения.</p>${db.tests.filter(t=>t.correct/t.total<.8).map(t=>`<span class="chip">Повторить: ${esc(t.topic)}</span>`).join(' ')}</section>`}
function tasks(){return `<h1>Орбита · План дня</h1><div class="grid"><section class="panel"><h3>Добавить задачу</h3><form id="taskForm" class="stack">${field('Что нужно сделать','name')}${field('Дедлайн','due','date',`value="${today()}"`)}${field('Длительность, минут','minutes','number','min="5" value="45"')}<div><label>Приоритет</label><select name="priority"><option value="3">Высокий</option><option value="2" selected>Средний</option><option value="1">Низкий</option></select></div><button class="btn">Добавить на орбиту</button></form></section><section class="panel"><h3>Занятое время</h3><p class="small muted">Укажи интервалы занятий, чтобы планировщик их не занимал.</p><form id="blockForm" class="stack">${field('Дата','date','date',`value="${today()}"`)}<div class="fields">${field('С','start','time','value="17:00"')}${field('До','end','time','value="18:30"')}</div><button class="btn secondary">Добавить интервал</button></form>${db.blocks.map(b=>`<div class="item small">${b.date} · ${b.start}–${b.end} <button class="btn secondary" data-action="delblock" data-id="${b.id}">×</button></div>`).join('')}</section></div><section class="panel"><div class="row"><h2>Мои задачи</h2><button class="btn secondary" data-action="schedule">✦ Впихнуть в график</button></div><p class="notice">Подбор времени работает в пределах 16:00–21:00 на ближайшие 7 дней, с перерывами по 10 минут. Это базовый алгоритм, а не полноценный ИИ-планировщик.</p>${db.tasks.slice().sort((a,b)=>Number(a.done)-Number(b.done)||b.priority-a.priority||a.due.localeCompare(b.due)).map(t=>`<div class="item ${t.done?'done':''}"><div class="row"><strong>${t.done?'✓':'○'} ${esc(t.name)}</strong><span class="small muted">${t.due} · ${t.minutes} мин</span></div>${t.slot?`<p class="small">✧ Предложено: ${esc(t.slot)}</p>`:''}<div class="tabs">${!t.done?`<button class="btn" data-action="donetask" data-id="${t.id}">Готово</button>`:''}<button class="btn secondary" data-action="deltask" data-id="${t.id}">Удалить</button></div></div>`).join('')||empty('Пока нет задач.')}</section>`}
function habits(){return `<h1>Пульсар · Привычки</h1><section class="panel"><form id="habitForm" class="row"><div style="flex:1;min-width:180px">${field('Новая привычка','name')}</div><button class="btn">Добавить</button></form><p class="small muted">Отмечай привычки каждый день. За отметку получаешь 2 единицы звездной пыли.</p>${db.habits.map(h=>`<div class="item row"><div><strong>✺ ${esc(h.name)}</strong><div class="small muted">Всего отметок: ${h.dates.length}</div></div><div class="tabs"><button class="btn ${h.dates.includes(today())?'secondary':''}" data-action="togglehabit" data-id="${h.id}">${h.dates.includes(today())?'✓ Сегодня':'Отметить'}</button><button class="btn secondary" data-action="delhabit" data-id="${h.id}">×</button></div></div>`).join('')}</section><section class="panel"><h3>🐈‍⬛ Твой космический котик</h3><p>Звездная пыль: <strong>${db.coins}</strong></p><p class="muted small">Котик пока живет на главной странице. Магазин предметов добавим в следующей версии.</p></section>`}
function archive(){let all=db.missions.filter(m=>m.done);return `<h1>Архив сверхновых</h1><p class="muted">Каждая завершенная миссия остается в архиве. Открой звезду, чтобы увидеть результаты.</p><div class="grid">${all.map(m=>`<div class="panel"><div style="font-size:48px;text-align:center;text-shadow:0 0 25px #a37dff">✹</div><h3>${esc(m.name)}</h3><p class="small muted">${esc(m.subject)}</p><p>100% выполнено · ${m.minutes} минут</p><p class="small muted">${m.created} → ${m.completed}</p><button class="btn secondary" data-action="details" data-id="${m.id}">Открыть звезду</button></div>`).join('')||empty('Здесь появятся завершенные звезды.')} </div>`}
function friends(){return `<h1>Созвездие · Друзья</h1><section class="panel"><p class="notice">В этой версии можно экспортировать отчет и передать подруге файлом или текстом. Общие аккаунты, автоматическая синхронизация и живая лента потребуют Supabase.</p><h3>Мой отчет для друзей</h3><div class="grid"><div class="metric"><strong>${db.tests.length}</strong>Тестов</div><div class="metric"><strong>${db.tasks.filter(t=>t.done).length}</strong>Задач</div><div class="metric"><strong>${db.missions.filter(m=>m.done).length}</strong>Сверхновых</div></div><div class="tabs"><button class="btn" data-action="share">Скопировать отчет</button><button class="btn secondary" data-action="export">Скачать свои данные</button></div></section><section class="panel"><h3>Будущая общая галактика</h3><p class="muted">Приглашения по нику, совместные миссии, сравнение результатов, личные звездные карты. Самочувствие и цикл никогда не попадут в общий отчет автоматически.</p></section>`}
function health(){return `<h1>Состояние · Лунная планета</h1><p class="notice">Приватные записи. Веб-сайт не подключен к Apple Health. Не используем эти данные для медицинских выводов.</p><div class="grid"><section class="panel"><h3>Менструальный календарь</h3><form id="cycleForm" class="stack">${field('Дата начала','start','date',`value="${today()}"`)}${field('Продолжительность, дней','length','number','min="1" max="20" value="5"')}<button class="btn">Сохранить цикл</button></form>${db.cycles.slice().reverse().map(c=>`<div class="item small">Начало: ${c.start} · ${c.length} дней</div>`).join('')||empty('Записей пока нет.')}${db.cycles.length?`<p class="small muted">Ориентировочное следующее начало (при условном 28-дневном цикле): ${new Date(new Date(db.cycles[db.cycles.length-1].start+'T12:00:00').getTime()+28*86400000).toLocaleDateString('ru-RU')}. Это не медицинский прогноз.</p>`:''}</section><section class="panel"><h3>Дневник самочувствия</h3><form id="moodForm" class="stack"><div><label>Самочувствие</label><select name="mood"><option>Отлично</option><option>Нормально</option><option>Устала</option><option>Плохо</option></select></div><div><label>Заметка</label><textarea name="note" rows="3" placeholder="Как прошел день?"></textarea></div><button class="btn">Сохранить</button></form>${db.moods.slice().reverse().slice(0,8).map(m=>`<div class="item small">${m.date} · ${esc(m.mood)} · ${esc(m.note)}</div>`).join('')}</section></div>`}
function space(){return `<h1>Обсерватория</h1><section class="panel"><h3>Космос сегодня</h3><p class="muted">Подборка проверяемых источников. Автоматическую новостную ленту подключим позднее.</p><div class="stack"><a href="https://science.nasa.gov/" target="_blank" rel="noopener noreferrer">NASA Science · исследования и открытия ↗</a><a href="https://www.esa.int/Science_Exploration/Space_Science" target="_blank" rel="noopener noreferrer">ESA Space Science · космические миссии ↗</a><a href="https://apod.nasa.gov/apod/astropix.html" target="_blank" rel="noopener noreferrer">Astronomy Picture of the Day · снимок дня ↗</a></div></section>`}
function settings(){return `<h1>Ядро VESPER</h1><section class="panel"><h3>Твоя система</h3><form id="settingsForm" class="stack">${field('Имя','name','text',`value="${esc(db.settings.name)}"`)}<div><label>Космический фон</label><select name="theme"><option value="nebula" ${db.settings.theme==='nebula'?'selected':''}>Туманность</option><option value="solar" ${db.settings.theme==='solar'?'selected':''}>Солнечная система</option><option value="void" ${db.settings.theme==='void'?'selected':''}>Черная дыра</option></select></div><button class="btn">Сохранить настройки</button></form><p class="small muted">В этой версии темы меняют палитру сцены; отдельные 3D-модели будут добавлены позже.</p></section><section class="panel"><h3>Резервное копирование</h3><div class="tabs"><button class="btn secondary" data-action="export">Скачать JSON</button><label class="btn secondary" style="cursor:pointer">Восстановить JSON<input type="file" id="importFile" accept=".json,application/json" style="display:none"></label></div><p class="small muted">Данные сохраняются только в текущем браузере. Перед очисткой браузера скачай резервную копию. Файл содержит и личные записи о цикле и самочувствии, никому его не отправляй.</p></section>`}
function action(a,i){if(a==='zoomin'||a==='zoomout'){zoom=Math.max(.7,Math.min(1.5,zoom+(a==='zoomin'?.15:-.15)));document.getElementById('system').style.setProperty('--zoom',zoom);return}if(a==='step'||a==='finish'){let m=db.missions.find(x=>x.id===i);if(!m)return;if(a==='step'){m.steps=Math.min(m.target,m.steps+1);m.minutes+=25}else m.steps=m.target;if(m.steps>=m.target){m.done=true;m.completed=today();db.coins+=20;alert('✹ Сверхновая! Миссия перемещена в архив.')}save();render();return}if(a==='details'){let m=db.missions.find(x=>x.id===i);alert(`${m.name}\nВыполнение: 100%\nВремя: ${m.minutes} мин\nЭтапы: ${m.steps}/${m.target}\nНачало: ${m.created}\nЗавершение: ${m.completed}`);return}if(a==='donetask'||a==='deltask'){let t=db.tasks.find(x=>x.id===i);if(a==='donetask'&&t&&!t.done){t.done=true;db.coins+=5}else if(a==='deltask')db.tasks=db.tasks.filter(x=>x.id!==i)}if(a==='togglehabit'){let h=db.habits.find(x=>x.id===i);if(h){if(h.dates.includes(today())){h.dates=h.dates.filter(d=>d!==today());db.coins=Math.max(0,db.coins-2)}else{h.dates.push(today());db.coins+=2}}}if(a==='delhabit')db.habits=db.habits.filter(x=>x.id!==i);if(a==='delblock')db.blocks=db.blocks.filter(x=>x.id!==i);if(a==='schedule'){scheduleTasks();return}if(a==='share'){let t=`VESPER · Мои достижения\nТестов: ${db.tests.length}\nЗадач выполнено: ${db.tasks.filter(x=>x.done).length}\nМиссий завершено: ${db.missions.filter(x=>x.done).length}\nЗвездная пыль: ${db.coins}`;navigator.clipboard?.writeText(t).then(()=>alert('Отчет скопирован')).catch(()=>prompt('Скопируй отчет:',t));return}if(a==='export'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vesper-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}save();render()}
function scheduleTasks(){let pending=db.tasks.filter(t=>!t.done).sort((a,b)=>a.due.localeCompare(b.due)||b.priority-a.priority);let busy={};for(let b of db.blocks){(busy[b.date]??=[]).push([toMin(b.start),toMin(b.end)])}for(let t of pending){t.slot='';let duration=Math.min(300,Math.max(5,t.minutes));for(let d=0;d<7&&!t.slot;d++){let date=new Date();date.setDate(date.getDate()+d);let day=date.toLocaleDateString('en-CA');if(day>t.due)continue;for(let start=960;start+duration<=1260;start+=15){let end=start+duration;if((busy[day]||[]).every(([s,e])=>end+10<=s||start>=e+10)){t.slot=`${day} ${fmt(start)}–${fmt(end)}`;(busy[day]??=[]).push([start,end]);break}}}if(!t.slot)t.slot='Нет свободного окна до дедлайна'}}save();render()};const toMin=s=>{let [h,m]=s.split(':').map(Number);return h*60+m};const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
document.addEventListener('submit',e=>{if(!e.target.id)return;e.preventDefault();let f=Object.fromEntries(new FormData(e.target).entries());switch(e.target.id){case'missionForm':db.missions.push({id:id(),name:f.name,subject:f.subject,target:Math.max(1,num(f.target)),steps:0,minutes:0,created:today(),done:false});break;case'testForm':{let total=num(f.total),correct=num(f.correct);if(!total||correct>total){alert('Проверь количество ответов');return}db.tests.push({id:id(),topic:f.topic,subject:f.subject,total,correct,minutes:num(f.minutes),date:today()});db.coins+=3;break}case'taskForm':db.tasks.push({id:id(),name:f.name,due:f.due,minutes:num(f.minutes),priority:num(f.priority),done:false,slot:''});break;case'blockForm':if(f.start>=f.end){alert('Время окончания должно быть позже начала');return}db.blocks.push({id:id(),...f});break;case'habitForm':db.habits.push({id:id(),name:f.name,dates:[]});break;case'cycleForm':db.cycles.push({id:id(),start:f.start,length:num(f.length)});db.cycles.sort((a,b)=>a.start.localeCompare(b.start));break;case'moodForm':db.moods.push({id:id(),date:today(),mood:f.mood,note:f.note});break;case'settingsForm':db.settings={name:f.name,theme:f.theme};break}save();render()});document.addEventListener('change',e=>{if(e.target.id==='importFile'){let file=e.target.files[0];if(!file)return;file.text().then(t=>{try{let v=JSON.parse(t);if(!Array.isArray(v.missions)||!Array.isArray(v.tasks)||!Array.isArray(v.tests))throw Error('invalid');if(confirm('Заменить текущие данные содержимым резервной копии?')){db={...defaultData(),...v};save();render()}}catch{alert('Не удалось прочитать резервную копию')}})}});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
